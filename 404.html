<title>El Zaguán</title>
<style>body{margin:0;background:#142b25;color:#efe7d4;font:16px/1.6 "Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}a{color:#d9b77e}</style>
<script>
// GitHub Pages sirve este archivo para cualquier ruta que no existe. Busca la raíz de la muestra:
// la primera carpeta del camino si el sitio vive en una subcarpeta (usuario.github.io/<repo>/), o "/".
(function(){var p=location.pathname.split('/').filter(Boolean);
var raiz=(location.hostname.endsWith('github.io')&&p.length)?'/'+p[0]+'/':'/';
location.replace(raiz);})();
</script></head>
<body><p>Esta página no está en la muestra. <a href="/">Volver a la vereda</a>.</p></body></html>
